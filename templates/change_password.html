{% extends 'base.html' %}
{% block content %}
<div class="row justify-content-center fade-in">
    <div class="col-md-6">
        <div class="card p-4">
            <div class="text-center mb-4">
                <div style="width:70px;height:70px;border-radius:50%;background:var(--primary-light);display:flex;align-items:center;justify-content:center;margin:0 auto 1rem;font-size:1.8rem;">🔑</div>
                <h4 class="fw-bold">Change Password</h4>
                <p class="text-muted">Update your account password below.</p>
            </div>
            <form method="POST">
                <div class="mb-3">
                    <label class="form-label">Current Password</label>
                    <input type="password" name="old_password" class="form-control" placeholder="Enter current password" required>
                </div>
                <div class="mb-4">
                    <label class="form-label">New Password</label>
                    <input type="password" name="new_password" class="form-control" placeholder="Enter new password" minlength="6" required>
                </div>
                <button type="submit" class="btn btn-warning-custom w-100">
                    <i class="fas fa-save me-2"></i>Update Password
                </button>
                <a href="{{ url_for('dashboard') }}" class="btn btn-outline-custom w-100 mt-2">
                    <i class="fas fa-arrow-left me-1"></i>Back to Dashboard
                </a>
            </form>
        </div>
    </div>
</div>
{% endblock %}
